<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Deploy Hub domain relationship map</title>
  <desc id="desc">A relationship diagram showing access, source, deployment, runtime, security, and operations entities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.section{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}.source{fill:#eff6ff;stroke:#93c5fd}.deploy{fill:#f0fdf4;stroke:#86efac}.runtime{fill:#fff7ed;stroke:#fdba74}.ops{fill:#fdf4ff;stroke:#e879f9}.access{fill:#f1f5f9;stroke:#94a3b8}.box{stroke-width:2;rx:10}.t{font:600 18px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.h{font:700 22px system-ui,sans-serif;fill:#1e293b}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.label{font:12px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1500" height="940"/>
  <text class="h" x="40" y="42">Deploy Hub domain model</text>

  <rect class="section" x="30" y="70" width="330" height="260" rx="16"/>
  <text class="t" x="50" y="102">Access boundary</text>
  <rect class="box access" x="65" y="130" width="120" height="62"/><text class="t" x="92" y="168">User</text>
  <rect class="box access" x="210" y="130" width="120" height="62"/><text class="t" x="222" y="168">Membership</text>
  <rect class="box access" x="135" y="235" width="140" height="62"/><text class="t" x="157" y="273">Workspace</text>
  <path class="line" d="M185 161 H210"/><text class="label" x="190" y="150">has</text>
  <path class="line" d="M270 192 V235"/><text class="label" x="277" y="220">scopes</text>

  <rect class="section" x="390" y="70" width="700" height="500" rx="16"/>
  <text class="t" x="410" y="102">Source, configuration, and deployment history</text>
  <rect class="box source" x="430" y="135" width="150" height="68"/><text class="t" x="470" y="175">Project</text>
  <rect class="box source" x="635" y="115" width="170" height="68"/><text class="t" x="655" y="155">SourceRevision</text>
  <rect class="box source" x="635" y="205" width="170" height="68"/><text class="t" x="678" y="245">ScanRun</text>
  <rect class="box source" x="430" y="300" width="150" height="68"/><text class="t" x="482" y="340">Site</text>
  <rect class="box deploy" x="635" y="300" width="170" height="68"/><text class="t" x="650" y="340">ConfigRevision</text>
  <rect class="box deploy" x="860" y="300" width="170" height="68"/><text class="t" x="900" y="340">Manifest</text>
  <rect class="box deploy" x="860" y="415" width="170" height="68"/><text class="t" x="885" y="455">Deployment</text>
  <rect class="box deploy" x="635" y="470" width="170" height="68"/><text class="t" x="645" y="510">DeploymentAttempt</text>
  <rect class="box deploy" x="430" y="470" width="150" height="68"/><text class="t" x="447" y="510">DeploymentStep</text>
  <path class="line" d="M580 165 H635"/><text class="label" x="592" y="154">receives</text>
  <path class="line" d="M580 183 C610 200 610 225 635 235"/><text class="label" x="585" y="220">scanned by</text>
  <path class="line" d="M505 203 V300"/><text class="label" x="512" y="260">deploys as</text>
  <path class="line" d="M580 334 H635"/><text class="label" x="590" y="323">drafts</text>
  <path class="line" d="M805 334 H860"/><text class="label" x="814" y="323">freezes</text>
  <path class="line" d="M945 368 V415"/><text class="label" x="952" y="398">deploys</text>
  <path class="line" d="M860 452 C825 452 825 504 805 504"/><text class="label" x="813" y="474">attempts</text>
  <path class="line" d="M635 504 H580"/><text class="label" x="588" y="493">steps</text>

  <rect class="section" x="1120" y="70" width="350" height="500" rx="16"/>
  <text class="t" x="1140" y="102">Runtime and edge</text>
  <rect class="box runtime" x="1160" y="135" width="130" height="64"/><text class="t" x="1196" y="174">Target</text>
  <rect class="box runtime" x="1310" y="135" width="130" height="64"/><text class="t" x="1323" y="174">SiteInstance</text>
  <rect class="box runtime" x="1160" y="250" width="130" height="64"/><text class="t" x="1180" y="289">DNSZone</text>
  <rect class="box runtime" x="1310" y="250" width="130" height="64"/><text class="t" x="1322" y="289">DNSRecord</text>
  <rect class="box runtime" x="1160" y="365" width="130" height="64"/><text class="t" x="1172" y="404">TLSCertificate</text>
  <rect class="box runtime" x="1310" y="365" width="130" height="64"/><text class="t" x="1320" y="404">BackupUnit</text>
  <rect class="box runtime" x="1235" y="475" width="130" height="64"/><text class="t" x="1267" y="514">Finding</text>
  <path class="line" d="M1290 167 H1310"/><text class="label" x="1284" y="154">hosts</text>
  <path class="line" d="M1290 282 H1310"/><text class="label" x="1288" y="269">owns</text>

  <rect class="section" x="30" y="600" width="1440" height="300" rx="16"/>
  <text class="t" x="50" y="635">Security, artifacts, partners, and operations</text>
  <rect class="box ops" x="65" y="680" width="170" height="68"/><text class="t" x="82" y="720">SecretBinding</text>
  <rect class="box ops" x="285" y="680" width="170" height="68"/><text class="t" x="307" y="720">SecretVersion</text>
  <rect class="box ops" x="505" y="680" width="170" height="68"/><text class="t" x="522" y="720">BuildArtifact</text>
  <rect class="box ops" x="725" y="680" width="180" height="68"/><text class="t" x="737" y="720">ArtifactSnapshot</text>
  <rect class="box ops" x="955" y="680" width="150" height="68"/><text class="t" x="988" y="720">Partner</text>
  <rect class="box ops" x="1155" y="680" width="150" height="68"/><text class="t" x="1170" y="720">PartnerSite</text>
  <rect class="box ops" x="120" y="795" width="170" height="68"/><text class="t" x="135" y="835">UploadSession</text>
  <rect class="box ops" x="355" y="795" width="180" height="68"/><text class="t" x="370" y="835">UploadedObject</text>
  <rect class="box ops" x="610" y="795" width="170" height="68"/><text class="t" x="638" y="835">AuditEvent</text>
  <rect class="box ops" x="855" y="795" width="170" height="68"/><text class="t" x="878" y="835">OutboxEvent</text>
  <rect class="box ops" x="1100" y="795" width="190" height="68"/><text class="t" x="1112" y="835">DeletionRequest</text>
  <rect class="box ops" x="1330" y="795" width="110" height="68"/><text class="t" x="1348" y="835">PurgeJob</text>
  <path class="line" d="M235 714 H285"/><text class="label" x="246" y="703">versions</text>
  <path class="line" d="M675 714 H725"/><text class="label" x="682" y="703">records</text>
  <path class="line" d="M1105 714 H1155"/><text class="label" x="1112" y="703">owns</text>
  <path class="line" d="M290 829 H355"/><text class="label" x="300" y="818">promotes</text>
  <path class="line" d="M1025 829 H1100"/><text class="label" x="1034" y="818">may request</text>
  <path class="line" d="M1290 829 H1330"/><text class="label" x="1294" y="818">executes</text>

  <path class="line dash" d="M205 297 C205 440 500 620 610 795"/><text class="label" x="260" y="460">all mutations audited</text>
  <path class="line dash" d="M945 483 C945 600 820 610 815 680"/><text class="label" x="850" y="605">snapshots</text>
  <path class="line dash" d="M505 368 C480 590 150 590 150 680"/><text class="label" x="300" y="585">consumes secrets</text>
</svg>
