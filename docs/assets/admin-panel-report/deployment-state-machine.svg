<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">Deployment state machine</title>
  <desc id="desc">Deployment states from validation through approval, scheduling, execution, retry, rollback, and terminal outcomes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.n{fill:#fff;stroke:#64748b;stroke-width:2}.ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.wait{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.bad{fill:#fff1f2;stroke:#f43f5e;stroke-width:2}.t{font:600 16px system-ui,sans-serif;fill:#0f172a}.h{font:700 22px system-ui,sans-serif;fill:#1e293b}.s{font:12px system-ui,sans-serif;fill:#475569}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1500" height="880"/><text class="h" x="40" y="42">Deployment state machine</text>
  <circle cx="80" cy="150" r="18" fill="#0f172a"/><rect class="n" x="145" y="115" width="170" height="70" rx="12"/><text class="t" x="190" y="157">validating</text><path class="l" d="M98 150 H145"/>
  <rect class="bad" x="405" y="70" width="170" height="70" rx="12"/><text class="t" x="452" y="112">refused</text>
  <rect class="wait" x="405" y="165" width="170" height="70" rx="12"/><text class="t" x="425" y="207">awaiting approval</text>
  <rect class="wait" x="405" y="260" width="170" height="70" rx="12"/><text class="t" x="450" y="302">scheduled</text>
  <rect class="wait" x="675" y="165" width="170" height="70" rx="12"/><text class="t" x="730" y="207">queued</text>
  <rect class="wait" x="945" y="165" width="180" height="70" rx="12"/><text class="t" x="968" y="207">waiting for lock</text>
  <rect class="n" x="1215" y="165" width="170" height="70" rx="12"/><text class="t" x="1268" y="207">running</text>
  <path class="l" d="M315 135 C350 135 360 105 405 105"/><text class="s" x="335" y="118">blockers</text>
  <path class="l" d="M315 150 C350 150 360 200 405 200"/><text class="s" x="330" y="184">policy</text>
  <path class="l" d="M315 165 C350 165 360 295 405 295"/><text class="s" x="330" y="250">window</text>
  <path class="l" d="M315 150 C500 150 575 180 675 200"/><text class="s" x="520" y="156">ready</text>
  <path class="l" d="M575 200 H675"/><text class="s" x="600" y="188">approve</text>
  <path class="l" d="M575 295 C625 295 625 220 675 205"/><text class="s" x="600" y="277">window opens</text>
  <path class="l" d="M845 200 H945"/><path class="l" d="M1125 200 H1215"/><text class="s" x="1137" y="188">lease</text>

  <rect class="wait" x="1215" y="330" width="170" height="70" rx="12"/><text class="t" x="1246" y="372">cancelling</text>
  <rect class="bad" x="1215" y="495" width="170" height="70" rx="12"/><text class="t" x="1258" y="537">cancelled</text>
  <rect class="ok" x="945" y="330" width="170" height="70" rx="12"/><text class="t" x="982" y="372">succeeded</text>
  <rect class="bad" x="675" y="330" width="170" height="70" rx="12"/><text class="t" x="727" y="372">failed</text>
  <rect class="wait" x="405" y="470" width="170" height="70" rx="12"/><text class="t" x="438" y="512">retry queued</text>
  <path class="l" d="M1300 235 V330"/><text class="s" x="1310" y="286">cancel request</text>
  <path class="l" d="M1300 400 V495"/><text class="s" x="1310" y="454">safe boundary</text>
  <path class="l" d="M1215 215 C1150 255 1110 330 1115 365"/><text class="s" x="1120" y="290">all gates pass</text>
  <path class="l" d="M1215 220 C1070 310 920 365 845 365"/><text class="s" x="1010" y="344">terminal failure</text>
  <path class="l" d="M675 365 C620 365 610 505 575 505"/><text class="s" x="595" y="435">retry</text>
  <path class="l" d="M405 505 C300 505 320 200 675 200"/><text class="s" x="325" y="415">new attempt</text>

  <rect class="wait" x="675" y="635" width="190" height="70" rx="12"/><text class="t" x="697" y="677">rollback queued</text>
  <rect class="wait" x="945" y="635" width="180" height="70" rx="12"/><text class="t" x="974" y="677">rolling back</text>
  <rect class="ok" x="1215" y="600" width="170" height="70" rx="12"/><text class="t" x="1250" y="642">rolled back</text>
  <rect class="bad" x="1215" y="720" width="170" height="70" rx="12"/><text class="t" x="1235" y="762">rollback failed</text>
  <path class="l" d="M760 400 V635"/><text class="s" x="770" y="530">explicit rollback</text>
  <path class="l" d="M1030 400 C1030 500 810 520 790 635"/><text class="s" x="885" y="500">rollback request</text>
  <path class="l" d="M865 670 H945"/><path class="l" d="M1125 655 C1160 655 1170 635 1215 635"/><text class="s" x="1140" y="625">success</text>
  <path class="l" d="M1125 680 C1170 680 1170 755 1215 755"/><text class="s" x="1145" y="729">failure</text>
</svg>
