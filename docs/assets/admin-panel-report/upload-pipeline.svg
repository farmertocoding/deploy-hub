<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">Secure upload pipeline</title><desc id="desc">Upload session, direct upload, verification, quarantine, scanning, promotion, and refusal flow.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.g{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.y{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.r{fill:#fff1f2;stroke:#f43f5e;stroke-width:2}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.h{font:700 22px system-ui,sans-serif;fill:#1e293b}.s{font:12px system-ui,sans-serif;fill:#475569}.l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1500" height="420"/><text class="h" x="40" y="44">Secure upload pipeline</text>
  <rect class="b" x="50" y="125" width="180" height="78" rx="12"/><text class="t" x="72" y="158">Create upload</text><text class="t" x="102" y="181">session</text>
  <rect class="b" x="280" y="125" width="190" height="78" rx="12"/><text class="t" x="309" y="158">Direct multipart</text><text class="t" x="340" y="181">upload</text>
  <rect class="b" x="520" y="125" width="200" height="78" rx="12"/><text class="t" x="546" y="158">Verify SHA-256,</text><text class="t" x="568" y="181">size, and type</text>
  <rect class="y" x="770" y="125" width="170" height="78" rx="12"/><text class="t" x="815" y="170">Quarantine</text>
  <polygon class="y" points="1080,105 1190,164 1080,223 970,164"/><text class="t" x="1033" y="157">Purpose-specific</text><text class="t" x="1052" y="180">validation</text>
  <rect class="g" x="1260" y="85" width="190" height="78" rx="12"/><text class="t" x="1289" y="118">Promote immutable</text><text class="t" x="1322" y="141">object</text>
  <rect class="r" x="1260" y="245" width="190" height="78" rx="12"/><text class="t" x="1310" y="278">Refuse and</text><text class="t" x="1292" y="301">expire evidence</text>
  <path class="l" d="M230 164 H280"/><path class="l" d="M470 164 H520"/><path class="l" d="M720 164 H770"/><path class="l" d="M940 164 H970"/>
  <path class="l" d="M1190 140 C1215 120 1230 124 1260 124"/><text class="s" x="1200" y="108">pass</text>
  <path class="l" d="M1080 223 C1080 284 1195 284 1260 284"/><text class="s" x="1135" y="274">fail</text>
  <text class="s" x="760" y="338">Validation checks: archive traversal • symlinks • decompression ratio</text>
  <text class="s" x="845" y="362">malware • secrets • certificate/key validity</text>
  <text class="s" x="1285" y="190">create source, cert, key,</text><text class="s" x="1310" y="209">or restore record</text>
</svg>
