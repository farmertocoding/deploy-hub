      responses:
        '204':
          description: No response body
components:
  schemas:
    ActionEnum:
      enum:
      - ack
      - resolve
      - accept_risk
      type: string
      description: |-
        * `ack` - ack
        * `resolve` - resolve
        * `accept_risk` - accept_risk
    AttackState:
      type: object
      properties:
        detail:
          type: string
        finding_id:
          type: integer
        mode:
          type: string
      required:
      - detail
      - finding_id
      - mode
    AwsConnect:
      type: object
      properties:
        access_key_id:
          type: string
          writeOnly: true
          minLength: 1
        secret_access_key:
          type: string
          writeOnly: true
          minLength: 1
        region:
          type: string
          default: us-east-1
      required:
      - access_key_id
      - secret_access_key
    AwsConnectResult:
      type: object
      properties:
        account_id_last4:
          type: string
        region:
          type: string
      required:
      - account_id_last4
      - region
    AwsStatus:
      type: object
      properties:
        connected:
          type: boolean
        reason:
          type: string
      required:
      - connected
      - reason
    BackupDump:
      type: object
      properties:
        id:
          type: integer
        bytes:
          type: integer
        digest:
          type: string
        stored_at:
          type: string
        status:
          type: string
      required:
      - bytes
      - digest
      - id
      - status
      - stored_at
    BackupList:
      type: object
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/BackupUnit'
        restore_command:
          type: string
      required:
      - restore_command
      - units
    BackupRun:
      type: object
      properties:
        schema_version:
          type: integer
        unit_id:
          type: integer
        site_id:
          type: integer
        bytes:
          type: integer
        digest:
          type: string
        stored_at:
          type: string
      required:
      - bytes
      - digest
      - schema_version
      - site_id
      - stored_at
      - unit_id
    BackupUnit:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        schedule:
          type: string
        dumps:
          type: array
          items:
            $ref: '#/components/schemas/BackupDump'
      required:
      - dumps
      - id
      - kind
      - schedule
    CertRefusal:
      type: object
      properties:
        detail:
          type: string
        finding_id:
          type: integer
      required:
      - detail
      - finding_id
    CloudflareConnect:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    CloudflareConnectResult:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/DnsAccountConnected'
        zone:
          $ref: '#/components/schemas/DnsZoneConnected'
      required:
      - account
