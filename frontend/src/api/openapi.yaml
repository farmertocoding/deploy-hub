openapi: 3.0.3
info:
  title: Deploy Hub API
  version: 0.0.1
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        CSRF-protected even though unauthenticated (round-1 finding: login-CSRF —
        a cross-site page must not be able to log the victim into an attacker account).
        The SPA fetches /api/auth/me/ on load, which plants the CSRF cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Session hydration for the SPA. AllowAny: the anonymous response is the
        SPA's pre-login bootstrap and plants the CSRF cookie (get_token) so the
        login POST itself can be CSRF-checked.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/totp/confirm/:
    post:
      operationId: auth_totp_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Confirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Confirm'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/totp/enroll/:
    post:
      operationId: auth_totp_enroll_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/webauthn/login/begin/:
    post:
      operationId: auth_webauthn_login_begin_create
      description: Unauthenticated begin so login can take a WebAuthn assertion as
        2FA.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBegin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBegin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBegin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/demo-jobs/:
    post:
      operationId: demo_jobs_create
      tags:
      - demo-jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoJob'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/topics/{topic}/snapshot/:
    get:
      operationId: topics_snapshot_retrieve
      description: 'Snapshot-then-stream (§D7): every snapshot returns {seq, data}
        from the same counter.'
      parameters:
      - in: path
        name: topic
        schema:
          type: string
        required: true
      tags:
      - topics
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/aws/connect/:
    get:
      operationId: v1_aws_connect_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsStatus'
          description: ''
    post:
      operationId: v1_aws_connect_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsConnect'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AwsConnect'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AwsConnect'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsConnectResult'
          description: ''
  /api/v1/cloudflare/connect/:
    post:
      operationId: v1_cloudflare_connect_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudflareConnect'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CloudflareConnect'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CloudflareConnect'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareConnectResult'
          description: ''
  /api/v1/dns-accounts/{account_id}/origin-ca-plant/:
    post:
      operationId: v1_dns_accounts_origin_ca_plant_create
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OriginCaPlant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OriginCaPlant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OriginCaPlant'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginCaPlantResult'
          description: ''
  /api/v1/findings/:
    get:
      operationId: v1_findings_retrieve
      parameters:
      - in: query
        name: entity
        schema:
          type: string
          maxLength: 128
          minLength: 1
      - in: query
        name: severity
        schema:
          enum:
          - p1
          - p2
          - p3
          type: string
          minLength: 1
        description: |-
          * `p1` - P1
          * `p2` - P2
          * `p3` - P3
      - in: query
        name: state
        schema:
          enum:
          - open
          - acked
          - resolved
          - accepted
          type: string
          minLength: 1
        description: |-
          * `open` - Open
          * `acked` - Acked
          * `resolved` - Resolved
          * `accepted` - Accepted
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListSnapshot'
          description: ''
  /api/v1/findings/{id}/:
    get:
      operationId: v1_findings_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetailSnapshot'
          description: ''
  /api/v1/findings/{id}/transition/:
    post:
      operationId: v1_findings_transition_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetailSnapshot'
          description: ''
  /api/v1/first-run/:
    get:
      operationId: v1_first_run_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstRunSnapshot'
          description: ''
  /api/v1/map/:
    get:
      operationId: v1_map_retrieve
      description: Table-backed map.graph snapshot (§D7 / MAP-96-GRAPH-V1).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapSnapshot'
          description: ''
  /api/v1/projects/:
    get:
      operationId: v1_projects_list
      description: |-
        What the readiness screen renders its left column from (F7-lite).

        tier COUNTS here, full check bodies from /readiness/ — the list stays cheap when
        projects grow. manifest_current answers the one freshness question the data model
        can answer honestly: does the latest manifest correspond to the CURRENT scan?
        (A true warnings-diff-since-last-manifest would need the prior report stored,
        which it isn't — noted in the F7 design decision rather than faked.)

        POST creates Project + Site in one transaction and binds dns_zone /
        primary_target from the eligible fleet (I-purpose / I-target).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
          description: ''
    post:
      operationId: v1_projects_create
      description: |-
        What the readiness screen renders its left column from (F7-lite).

        tier COUNTS here, full check bodies from /readiness/ — the list stays cheap when
        projects grow. manifest_current answers the one freshness question the data model
        can answer honestly: does the latest manifest correspond to the CURRENT scan?
        (A true warnings-diff-since-last-manifest would need the prior report stored,
        which it isn't — noted in the F7 design decision rather than faked.)

        POST creates Project + Site in one transaction and binds dns_zone /
        primary_target from the eligible fleet (I-purpose / I-target).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
          description: ''
  /api/v1/projects/{project_id}/readiness/:
    get:
      operationId: v1_projects_readiness_retrieve
      description: |-
        The three-tier readiness report (§5.3), tiered server-side.

        Tiering happens here rather than in the client so the CLI, the UI and the pipeline
        all agree on what counts as a blocker.
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
  /api/v1/sites/{site_id}/:
    patch:
      operationId: v1_sites_partial_update
      description: Record the operator's Caddy-ownership decision. Never writes dns_zone.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteEdgeOwner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteEdgeOwner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteEdgeOwner'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEdgeOwner'
          description: ''
  /api/v1/sites/{site_id}/backups/:
    get:
      operationId: v1_sites_backups_retrieve
      description: 'GET: metadata-only dumps plus the restore command block.'
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
          description: ''
  /api/v1/sites/{site_id}/backups/{unit_id}/test/:
    post:
      operationId: v1_sites_backups_test_create
      description: 'POST: seal a dump with BACKUP_KEY, persist Hub-local, return metadata.'
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      - in: path
        name: unit_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRun'
          description: ''
  /api/v1/sites/{site_id}/env/:
    get:
      operationId: v1_sites_env_retrieve
      description: GET names; PUT replaces / PATCH merges values; POST applies the
        current env.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvNames'
          description: ''
    post:
      operationId: v1_sites_env_create
      description: GET names; PUT replaces / PATCH merges values; POST applies the
        current env.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvApply'
          description: ''
    put:
      operationId: v1_sites_env_update
      description: GET names; PUT replaces / PATCH merges values; POST applies the
        current env.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvNames'
          description: ''
    patch:
      operationId: v1_sites_env_partial_update
      description: GET names; PUT replaces / PATCH merges values; POST applies the
        current env.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEnvWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEnvWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEnvWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvNames'
          description: ''
  /api/v1/sites/{site_id}/manifest/:
    get:
      operationId: v1_sites_manifest_retrieve
      description: POST materializes version N+1; GET returns the latest frozen manifest.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
          description: ''
    post:
      operationId: v1_sites_manifest_create
      description: POST materializes version N+1; GET returns the latest frozen manifest.
      parameters:
      - in: path
        name: site_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Materialize'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Materialize'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Materialize'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
