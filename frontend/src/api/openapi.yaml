            schema:
              $ref: '#/components/schemas/PatchedAnswers'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardState'
          description: ''
  /api/v1/targets/{id}/delete/:
    post:
      operationId: v1_targets_delete_create
      description: 'T1: two passkeys + recent WebAuthn touch + type-the-name.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetDelete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TargetDelete'
          multipart/form-data:
