      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardState'
          description: ''
    patch:
      operationId: v1_sites_wizard_partial_update
      description: GET the question set and current answers; PATCH a partial answer
        set.
      parameters:
