  /api/v1/targets/{id}/ssh-rotate/:
    post:
      operationId: v1_targets_ssh_rotate_create
      description: 'T1: two passkeys + recent WebAuthn touch + type-the-name, then
        rotate.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshRotate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SshRotate'
          multipart/form-data:
            schema:
