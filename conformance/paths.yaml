  - providers/ec2.py
  - providers/route53.py
  - providers/ssm.py
  - providers/image_registry.py
  - providers/aws_creds.py
  - monitor/cloud_reaper.py
  - provision/aws_enroll.py
  - core/aws_views.py
  # Phase 5.5 (Task 0): the custody set the phase's tasks will land code
