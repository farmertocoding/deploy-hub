# Sensitive paths — always human-merged, no exceptions (build-process.md §5,
# as extended by review3). One path-glob check enforces this in CI.
sensitive:
  - vault/**
  - core/views.py            # auth/session code
  - core/otp.py              # 2FA enrollment + recovery codes
  - core/middleware.py       # mandatory-2FA gate
  - realtime/authorize.py    # topic authz choke point
  - realtime/consumers.py    # the only group_add call site
  - catalog/**
  - core/transport.py        # SSH transport seam
  - core/ssh.py              # SSH transport, host-key pin
  - providers/**
  - .github/workflows/**
  - conformance/requirements.yaml
  - conformance/check.py
  - scripts/**
  - intake/**
  # D-010 follow-up item 1: a scanner module can supersede a core check by emitting the
  # same id, which replaces it outright — tier included. `supersedes` now makes that a
  # declared, one-line act, but the thing being weakened can be `core.secret-scan`, a
  # blocker, so the declaration is worth a human's eyes.
  - scanner/modules/**
  # R7-9 (round 7): `scanner/declarations.py` holds the same authority as the modules
  # above and matched no glob here. It decides which findings are ELIGIBLE for the
  # `deployhub.yaml` downgrade — the validators, the manifest guard, the refusal rules —
  # and since R7-14 it also derives the confirm id the acceptance gate opens for. Change
  # either and `core.secret-scan` weakens, or the gate opens for a question the operator
  # was never asked. Named as a file rather than broadening to `scanner/**` so this
  # process edit stays the reviewable one-line act it is; `scanner/core.py` composes the
  # suite and is arguably the next candidate, which is a decision for its own PR.
  - scanner/declarations.py
  # spec-mutation-gate.md: the mutation gate's runner and its two derivations. §6's
  # anti-gaming rule is that the loop never edits the gate's config, scope list or
  # target in a round judged by it, and build-process.md §4 puts gate scripts on this
  # list by definition — a gate the loop can rewrite is a gate that reports what the
  # loop wants. The `[tool.mutmut]` scope itself lives in pyproject.toml, which is not
  # here: it is guarded instead by tests/test_mutation_gate.py's superset assertion,
  # because pyproject.toml also carries ruff/bandit/pytest settings that are ordinary
  # edits, and making every one of them a human merge would spend the guard's meaning.
  - scripts_dev/mutation_gate.py
  - scripts_dev/mutation_scope.py
  # Phase 2.5 (Task 16): the harness custody set. tests/harness/** drives real
  # SSH/docker/Multipass argv against test-plane targets; monitor/drills.py is
  # the Beat body that stops workers and probes sites; core/test_mode.py is the
  # §B9 credential wall itself; providers/test_dns.py is the only test-plane
  # DNS client and must never grow a prod-zone path (D-028). Weaken any of
  # these and the wall, the drills, or the reaper weakens with it.
  - tests/harness/**
  - monitor/drills.py
  - core/test_mode.py
  - providers/test_dns.py
