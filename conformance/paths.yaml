  # Do not broaden to deploys/** or frontend/** wholesale (D-075 / C12).
  - monitor/intake_poll.py
  - core/partner_webhooks.py
  - providers/custom_hostname.py
  - core/partner_views.py
  - monitor/partner_reaper.py
  - core/partner_verify.py
  - core/partner_templates.py
  - core/partner_jobs.py
  # Phase 6 (Task 0): the custody set the phase's tasks will land code
  # into, claimed before the first line of code. scanner/modules/**
  # and wizard/materialize.py already listed. Do not claim
  # monitor/tasks.py wholesale. Do not broaden to scaling/** or
