    text: >
      providers/ec2.py implements CloudProvider; `cloud_provider_for` is the only constructor; T1 `mock_aws_ec2`; RunInstances sets IMDSv2 hop-limit 1; default SG has no public 22.
  - id: AWS-R53-ADAPTER
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      providers/route53.py implements DnsProvider only; `proxied=True` raises; class is not EdgeProtection; L5 against that zone is notify-only.
  - id: AWS-ENROLL-PIN
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      pin `host_key_fingerprint` before any Transport; store `kind=aws_ec2` + `provider_ref`; empty pin refuses.
  - id: AWS-TEST-PLANE
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      `HUB_TEST_MODE` + `purpose=test` + `HUB_TEST_AWS_ACCOUNT_IDS` + `HUB_TEST_AWS_REGIONS`; explicit vault keys into boto3; empty ref / empty allowlist / default chain refuse; no `HUB_TEST_AWS_TOKEN`.
  - id: AWS-IAM-ALLOWLIST
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      construction and daily audit refuse `*` / `AdministratorAccess` / off-prefix SSM / off-zone Route 53; missing inspect refuses; Finding body is refs.
  - id: AWS-SSM-PULL
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      T1 fake in `providers/ssm.py`; push stays default; instance profile Get-only on `/deploy-hub/{target.pk}/*`; never `AWS_ACCESS_KEY_ID` on the target.
  - id: AWS-IMAGE-REGISTRY
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      `ImageRegistry` port + `image_registry_for`; docker load remains default; Fake requires TLS+auth and split push/pull creds; ECR boto3 only under `providers/image_registry.py`.
  - id: AWS-INSTANCE-T1
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      `instance.create` and `instance.terminate` are T1; `target.delete` on `aws_ec2` terminates then deletes.
  - id: UX-P5-AWS-OPERATOR
    phase: 5
    verify: test
    source: phase-5-design-note.md §3
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      Settings AWS tab (degraded, not Connected, when ref empty); cost on the T1 overlay; F8 enroll-empty/error/degraded; NAV stays six; copy says Target.
  - id: P5-AWS-DEMO
    phase: 5
    verify: demo
    source: phase-5-design-note.md §3
    demo:
      - conformance/demos/phase-5.md
    text_hash: sha256:478c38fcb51bb648f0a469458726d438b084f2bda51c420fe324734f3d33abe9
    text: >
      demo record names the MUST path in design note §4; no live AWS, no SSH-CA enablement, no DNS-01.

