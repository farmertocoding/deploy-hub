# Requirements registry (review3 §Q1). NEVER edited in the round judged by it
# (anti-gaming rule, build-process.md §4). Sensitive path: human-merge only.
#
# verify: test        -> >=1 collected test carries @pytest.mark.req("<id>") AND
#                        passed in the run recorded by conformance/run-report.json
# verify: demo        -> the artifact(s) named in `demo:` exist and are non-empty
#                        (fallback with a warning: conformance/demos/phase-N.md)
# verify: checklist   -> `gate:` names the Makefile target / CI step that enforces it
# verify: static-gate -> same as checklist
#
# R4-9 keys (SPEC-gate-integrity.md §3.2), all validated by conformance/check.py:
#   demo:      repo-relative artifact path(s); a trailing / means "directory with
#              at least one non-empty file" (rule 3)
#   gate:      a Makefile target that is a prerequisite of `review-round` AND is invoked
#              by at least one workflow step (round-5 F3 — a name alone proved nothing:
#              `noop-gate:\t@true`, or a workflow step *named* after the gate whose run:
#              was an echo, both made a req verified). Missing/unresolvable once the
#              req's phase is due = uncovered = red unless WAIVERS.md says otherwise
#              (rule 4). It asserts the gate is *declared and run*, not that it passes
#              today — and never that it enforces this particular req's text: claiming
#              a gate that enforces something else is round-5 F1 (see SEC-69-NO-SECRETS-
#              IN-EXHAUST, now waived).
#   text_hash: sha256 of the source section body in docs/plan/ (rule 6). Recomputed
#              on every run; a doc edit goes red until the req is re-reviewed and the
#              hash re-pinned from `python conformance/check.py --print-text-hashes`.
#              Four reqs carry no text_hash. They cite a doc that is not a frozen copy
#              under docs/plan/ (claude/project-inventory.md, DECISIONS.md), so there is
#              nothing to hash. HARD-V2-MESH-BEFORE-FIREWALL was the fifth: it is now
#              pinned to `### Quick start` in server-hardening.md plus review3 §V2.
#   tier:      t1|t2|t3 (default t1). D-024 + panel F1: tier:t2 / tier:t3 is verified
#              only by a passed test carrying that tier's pytest mark.
#              --exclude-tier t3 --exclude-tier t2 omit them from the due set
#              (review-round); conformance-3 stays all-tiers.
