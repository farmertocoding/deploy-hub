    text_hash: sha256:f8c841d6606401404529413fcbb5fbfd92651545422bcb8db3692ef314ab694f
    text: One Site materializes exactly ONE manifest (service + optional static route + optional jobs); manifest rows are append-only and versioned, and carry env NAMES only, never values.
