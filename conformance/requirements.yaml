  # ── Phase 3 (docs/phase-3-design-note.md §3, Task 0 / D-032). The SEC-B2 and
  # UX-F5 clause splits (D-035, D-040, SCAN-M4 shape): the full-text ids above
  # keep their text:/text_hash: untouched and carry NO marker while a clause is
  # unbuilt; the buildable clauses are the new phase-3 ids here and the unbuilt
  # clauses are the two phase-4 ids. New phase-3 ids sit `uncovered` until their
  # tasks land proofs — that ratchet is intended; do not waive them mid-phase.
  - id: SEC-B2-NO-TOKEN-ON-TARGET
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §B2
    text_hash: sha256:b5450f27ac6f53b51fc4824ff24c5559434cec8e3bca61df34ad32269de3d0b5
    text: >
      No DNS, edge, or Origin-CA credential ever reaches a target-bound
      surface - proven by a scan of put() payloads, run() argv, env files and
      env snapshots, Celery task kwargs, DeploymentArtifact bodies, generated
      Caddy/Dockerfile text, and the recorded Transport call log (the
      exfiltration clause of SEC-B2, D-035).
  - id: TLS-B2-HUB-DNS01-UNPROXIED
    phase: 4
    verify: test
    source: plan-addendum-2026-07-30.md §B2
    text_hash: sha256:b5450f27ac6f53b51fc4824ff24c5559434cec8e3bca61df34ad32269de3d0b5
    text: >
      Unproxied public sites get certificates via Hub-central DNS-01 with
      renewal owned by a Hub Beat job; until it is built the pipeline refuses
      with a Finding plus a visible Sites-screen state, never a bare exception
      (the unbuilt clause of SEC-B2, D-035).
  - id: UX-F5-T2-T3-FRICTION
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §F5
    text_hash: sha256:14f46f651559404d042c7f0f22e4e0c9c7cd1629b0c7eca3aa40632702dceb5f
    text: >
      Action tiers are one declarative table shared server and client - T2
      disruptive-reversible actions confirm with a diff summary; T3 recovery
      actions (rollback, restart, re-run check) are a single click with an
      undo toast and can never be gated behind step-up or a hardware touch
      (the buildable UX-F5 clauses, D-040).
  - id: SEC-F5-T1-HARDWARE-TOUCH
    phase: 4
    verify: test
    source: plan-addendum-2026-07-30.md §F5
    text_hash: sha256:14f46f651559404d042c7f0f22e4e0c9c7cd1629b0c7eca3aa40632702dceb5f
    text: >
      T1 irreversible/credential-touching actions (target delete, key export,
      KEK ops) require hardware touch plus type-the-name - lands with the
      WebAuthn step-up work (the unbuilt UX-F5 clause, D-040; see
      SEC-A2-WEBAUTHN-PHASE4).
  - id: DNS-CF-PRODUCT-ADAPTER
    phase: 3
    verify: test
    source: phase-3-design-note.md §1
    text_hash: sha256:f0b3fbc76b9b80c505762379e6d69ff384068f4b5c3ca6e30257b404c31f657e
    text: >
      providers/cloudflare.py implements the pinned DnsProvider against a
      DnsZone under a DnsAccount carrying three credential refs;
      providers/registry.py::dns_provider_for(zone) is the only construction
      path and enforces scope synchronously before the client is usable -
      Bearer only, an active token verify, and a zone probe returning exactly
      the one expected provider_zone_id; more zones means the client refuses
      to exist (D-034, D-046).
  - id: DNS-CF-T3-LIVE
    phase: 3
    verify: test
    tier: t3
    source: phase-3-design-note.md §4
    text_hash: sha256:9bea7481d92c03ac0610fe19798f0a00ac5d2e57d8ffb5c4942dc58e66bf7b0f
    text: >
      The credentialed T3 leg drives the product Cloudflare adapter under
      HUB_TEST_MODE against the allowlisted purpose=test zone and upserts a
      real proxied record; an absent test-zone token is skipped-only plus a
      dated waiver, never a T1-sibling green (D-034, D-043).
  - id: TLS-B2-ORIGIN-CERT-PUSH
    phase: 3
    verify: test
    tier: t2
    source: phase-3-design-note.md §1
    text_hash: sha256:f0b3fbc76b9b80c505762379e6d69ff384068f4b5c3ca6e30257b404c31f657e
    text: >
      Proxied sites get a Cloudflare Origin CA certificate issued Hub-side
      with the private key stored in the vault before anything is pushed;
      cert+key are written atomically through a 0700 root-owned tls dir as
      0400 root:root, key/cert match and checksum verified after write, Caddy
      reloaded, and a failed reload rolls back to the previous pair (D-035).
  - id: TLS-V9-CERT-THRESHOLDS
    phase: 3
    verify: test
    source: plan-addendum-2026-08-02-review3.md §V9
    text_hash: sha256:d802e283b0470a32bbee0cdfa20d32580eb509f12a9d466690638ceff453bf23
    text: >
      Cert-expiry alerts use the reconciled V9 thresholds - uploaded 45d=P3,
      21d=P2, 7d=P1; auto-renewed 7d=P2 (renewal is broken), 1d=P1 - enforced
      by the cert-expiry-daily check writing CheckRun rows.
  - id: ALERT-M3-PAGER-AUTH
    phase: 3
    verify: test
    source: plan-addendum-2026-08-02-review3.md §M3
    text_hash: sha256:aba556fe74a005591688b8cfd5974bb6d5cc74349210c629faf5ea971fe3a6d4
    text: >
      Pager access is authenticated with distinct publisher identities - Hub,
      healthchecks, and a per-target publish token issued at provisioning;
      subscriber read access is its own protected-topic credential no publish
      token can use; decommissioning a target revokes its publish token; push
      bodies are minimized and scrubbed, break-glass text only in the email
      copy, advisory-only (D-036).
  - id: ALERT-RECOVERY-NOTICE
    phase: 3
    verify: test
    source: alert-protocol.md §4
    text_hash: sha256:4dd501ae5fe91f30d52556d38b87ce1c4f0c87d2344df62df52bb624d60ea683
    text: >
      Every opened alert sends the mandatory recovery notice when it closes
      (close after 2 successes); ack stops repeats without resolving, and ack
      is never resolve.
  - id: ALERT-DELIVERY-BEHAVIORS
    phase: 3
    verify: test
    source: alert-protocol.md §1
    text_hash: sha256:c15a64dce5b36f4bf22ec4f1fd572fe3ca736988073ef278625ba337b3adfa58
    text: >
      Every delivery behaviour of the severities table has a named module and
      Beat entry - hourly re-push of unacked P1s and the 24h UNACKED email on
      alert-repeat-unacked, P2 grouping in monitor/antinoise.py, the 08:00 P3
      digest and the weekly trend rollup in monitor/digest.py; a failed email
      writes a Finding and never blocks the push path (D-037).
  - id: ALERT-PAGER-DRILL
    phase: 3
    verify: test
    source: alert-protocol.md §7
    text_hash: sha256:29e458de4bd31b4b9744a42ee46d159b883cb776357b7f966cd342d362a7a552
    text: >
      The monthly pager drill is a Beat job writing CheckRun rows with due_at
      seeded so find_missed works in prod; a skipped or missed pager drill
      alerts like a down site, never a silence.
  - id: MON-UPTIME-EVENTS
    phase: 3
    verify: test
    source: phase-3-design-note.md §1
    text_hash: sha256:f0b3fbc76b9b80c505762379e6d69ff384068f4b5c3ca6e30257b404c31f657e
    text: >
      UptimeEvent rows carry the transitions the hysteresis engine reads; the
      dead-man ping fires only after a probe cycle completes every target and
      a failed dead-man POST files its own Finding; the canary rule precedes
      any mass-outage declaration and degrades to one Hub-egress-degraded P2;
      mesh_only sites are probed Hub-to-tailnet over HTTP through the existing
      seams, never a second per-minute SSH session.
  - id: MON-TRAFFIC-INGEST
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §C4
    text_hash: sha256:54546eabfc1651075046dc639401c29cb09bdc2bfcb49eb212b6de49e1f3538d
    text: >
      Minute TrafficStat rows land from the collector; over the per-pull byte
      cap the on-host one-liner returns counts by status and top IPs, ingested
      as a summary flagged sampled true.
  - id: MON-C7-RETENTION
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §C7
    text_hash: sha256:9db6992fcd57ce58059c22c57b599eed452d8c6f944818c238ccf84ae374e2bb
    text: >
      The retention janitor enforces the pinned C7 numbers with plain nightly
      batched DELETEs - HostMetric raw 14d / hourly rollup 1y, UptimeEvent 90d
      / daily rollup forever, TrafficStat minute 48h / hour 90d / day forever,
      deploy logs to gzip after 30d, AuditEvent forever.
  - id: UX-F1-IA-NAV
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §F1
    text_hash: sha256:25bddf2237e098d7d0140026012b60ddfb0eec1ede97c953b12e851621fed7a9
    text: >
      Object-centric nav - Home is the map plus fleet cards as one composite
      screen, with Sites, Targets, Deploys, Findings, Settings; the advisors
      are tabs on their objects, never top-level pages.
  - id: UX-F4-FAILURE-IMPACT
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §F4
    text_hash: sha256:aa5d6f310ecf99467d4aec1550950a9ac3f9a1a07d03d50b4c32723508cf3ffa
    text: >
      A failed deployment shows an impact line first - old version still
      serving versus site may be unreachable, with recreate-strategy rows
      included - and at most three buttons (retry from step N, roll back,
      abort and clean up), each saying what it will do.
  - id: MAP-96-GRAPH-V1
    phase: 3
    verify: test
    source: deploy-system-plan.md §9.6
    text_hash: sha256:5524527edf560a79ec16f2203b440e5fcb9e9c16a337d2d308d7118bfa09fb28
    text: >
      Map v1 renders zones, hosts, containers, the Hub and the Cloudflare edge
      from one map.graph snapshot/topic with solid public versus dashed mesh
      edges and a list-view toggle; zone nodes are NetworkZone, never DnsZone,
      and status is never colour-only (D-041).
  - id: PROV-E6-ADOPT-TEMP-SUBDOMAIN
    phase: 3.5
    verify: test
    source: plan-addendum-2026-07-30.md §E6
    text_hash: sha256:e3b4c27253b89708b191c62032aba493919e2dc40926e0c8c7dc3c341a498f86
    text: >
      Adopt-existing-site deploys via the Hub to a temp subdomain, verifies,
      migrates or points the DB, then flips real DNS and decommissions the old
      path - never taking down the live manually-managed site during
      enrollment (may slip to 3b with PROV-J7 under D-044; a slip needs a
      waiver or a phase bump at exit).
  - id: P3-DNS-MONITOR-DEMO
    phase: 3
    verify: demo
    source: phase-3-design-note.md §4
    demo:
      - conformance/demos/phase-3.md
      - conformance/demos/phase-3/
    text_hash: sha256:9bea7481d92c03ac0610fe19798f0a00ac5d2e57d8ffb5c4942dc58e66bf7b0f
    text: >
      The phase-3 exit demo is recorded under conformance/demos/phase-3.md -
      Cloudflare connect from Settings, proxied A record in the allowlisted
      test zone, Origin cert push, the P1 open/ack/repeat/recover cycle,
      grouped P2s, host-down suppression, the digest, map v1, dead-man and
      canary, with the receiver registration as a dated artifact.

  # ── Phase 3.5 (docs/phase-3b-design-note.md §3, Task 0 / D-047…D-053).
  # Adopt ids above bump to 3.5 (text:/text_hash: untouched). New ids are
  # tier-less (no `tier:` key; QE I4). TLS-B2-HUB-DNS01-UNPROXIED stays
  # phase 4. New ids sit `uncovered` until later 3b tasks land proofs.
  - id: DNS-SITE-ZONE-BIND
    phase: 3.5
    verify: test
    source: phase-3b-design-note.md §3
    text_hash: sha256:9a3817da1102d505eab2f43e3c452e294d70e0b5e613960937be2c39e8d306dd
    text: >
      Public Site create binds Site.dns_zone to one matching-purpose eligible
      zone (purpose=prod, or purpose=test under HUB_TEST_MODE plus a name on
      HUB_TEST_ZONE_SLUGS). One eligible zone auto-binds; several require body
      dns_zone; zero eligible is 409 with zero Project, Site, and Finding
      rows. site-dns-unbound is illegal. Mesh-only may omit the FK. Site has
      no tier (D-047, D-053).
  - id: TLS-B2-ORIGIN-CA-PLANT
    phase: 3.5
    verify: test
    source: phase-3b-design-note.md §3
    text_hash: sha256:9a3817da1102d505eab2f43e3c452e294d70e0b5e613960937be2c39e8d306dd
    text: >
      Origin-CA plant is a Hub-local file read: POST body {path} only, and
      path must resolve inside an Origin-CA subdir
      (/etc/deploy-hub/origin-ca/ or /var/lib/deploy-hub/origin-ca/). Vault
      shape is API_TOKEN / owner_type=dns_account / owner_id=ref. Key bytes
      never enter the browser, the connect form, Findings, Manifest,
      CheckRun, or any deploys/ payload. Test-plane plant stays
      HUB_TEST_ORIGIN_CA_KEY; do not invent HUB_TEST_CF_TOKEN (D-047, D-053).
  - id: UX-F3-FIRST-RUN-CHECKLIST
    phase: 3.5
    verify: test
    source: phase-3b-design-note.md §3
    text_hash: sha256:9a3817da1102d505eab2f43e3c452e294d70e0b5e613960937be2c39e8d306dd
    text: >
      The first-run checklist owns Home until applicable items are done:
      enroll first target, connect Cloudflare (skip when the first site is
      mesh_only), plant Origin-CA (skip for mesh-only / unproxied-until-
      refused), then add a project (the POST that binds dns_zone and
      primary_target). After that, Home is today's map + fleet (D-047).
  - id: P3B-ADOPT-DEMO
    phase: 3.5
    verify: demo
    source: phase-3b-design-note.md §4
    demo:
      - conformance/demos/phase-3.5.md
    text_hash: sha256:09275704d3f15e7d434b38d17ff47a6a59cfe8b50e7103dc363291dd2592e138
    text: >
      The phase-3.5 exit demo is recorded under conformance/demos/phase-3.5.md
      - connect Cloudflare, plant Origin-CA, POST /api/v1/projects/ binds
      Site.dns_zone and primary_target, the F3 card leaves Home, occupied-
      host adopt, temp subdomain (public) or mesh-only verify-without-temp,
      verify-before-flip, live stays up until flip, abandon cleanup, volumes
      registered and never docker volume rm (D-047).

  # ── Phase 4 (docs/phase-4-design-note.md §3, Task 0 / D-054…D-064).
  # Already-due ids above stay phase 4 (text:/text_hash: untouched). New ids
  # are tier-less (no `tier:` key). TLS-B2-HUB-DNS01-UNPROXIED stays phase 4
  # and is waived as the named first slip. New ids sit `uncovered` until later
  # tasks land proofs. SCAN-DECLARED full-text stays unmarked until Task 3
  # (SCAN-M4). P4-SECURITY-DEMO names conformance/demos/phase-4.md; do not
  # stub that file here (missing is uncovered; a non-empty stub would verify).
  - id: SEC-L5-ATTACK-PLAYBOOK
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      monitor/attack_detector.py z-scores existing TrafficStat minute rows.
      monitor/attack_playbook.py engages set_security_level(under_attack),
      then ban_ip, then pager notify, then auto-relax. edge_protection_for(zone)
      is the only EdgeProtection constructor; CloudflareEdge lives in
      providers/cloudflare.py and loads edge_token_ref. Absent edge ref
      degrades to notify-only, never a silent no-op. Fingerprint is
      attack-playbook-engaged:{zone.pk}. deploys/ never imports
      providers.cloudflare. Token values never appear in Findings, CheckRun,
      logs, or task args (D-057).
  - id: SEC-L5-NEVER-SCALE-ATTACK
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      scaling/attack_gate.py::refuse_if_attack(site) is a named refuse:
      attack-shaped load never scales. Phase 6 must call it; Phase 4 tests
      the refuse. No scaler loop (D-057).
  - id: TOPO-R1-R5-FINDINGS
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      Topology advisor r1-r5 files Findings from monitor/map_graph.py::graph_snapshot
      plus Site/Target/SiteInstance, with no new graph library (D-041).
      Fingerprints are topology-hub-isolation:hub, topology-blast-radius:{target_pk},
      topology-site-network:{site_pk}, topology-db-mesh-only:{site_pk},
      topology-lan-segment:{zone_pk}. Accept-risk requires a reason.
  - id: SEC-B7-SSH-QUARTERLY-ROTATE
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      Scheduled quarterly SSH rotation is dual-key overlap: generate new Ed25519
      in-Hub, append pubkey, Transport.probe login with the new key, only then
      drop the old pubkey, point Target.ssh_key_ref, probe old fails / new works,
      revoke old Secret. ssh.rotate is T1. Beat ssh-rotate-quarterly is 90 d.
      Incomplete rotation is P1 ssh-rotation-incomplete; stale-old after intended
      revoke is P2 ssh-rotation-stale-key. Run-twice second pass has zero mutating
      Transport calls. Never ssh-keygen on the target (D-064).
  - id: UX-E5-BACKUP-OPERATOR
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      Backup operator surface persists sealed dumps at
      /var/lib/deploy-hub/backups/{checkrun_pk} mode 0600. CheckRun.Kind.BACKUP
      closed results are schema_version, unit_id, site_id, bytes, digest,
      stored_at (bytes is integer size; digest is sha256 of the sealed blob).
      Beat backup-nightly. Collect/seal/store failure and a missing nightly dump
      for a registered unit raise_alert hub-db-or-backup-failure P1. Sites-detail
      list plus T2 test-backup-now plus a restore command block; no Restore POST.
      Sealed dump uses Secret.Kind.BACKUP_KEY, never the KEK (D-063).
  - id: SEC-B8-TAILSCALE-DEVICE-POLL
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      Tailscale device-list poll is providers/tailscale.py plus FakeTailscale.
      Beat tailscale-device-audit-daily. Absent vault ref is skip-only plus a
      dated waiver. Settings ref is HUB_TAILSCALE_API_TOKEN_REF (vault owner-id,
      default empty). Do not invent a live token env. Tailnet-lock enablement
      is SLIP (D-058).
  - id: SEC-A3-KMS-KEK-ADAPTER
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      AWS KMS client lives in providers/kms.py. vault/kek.py::KmsKEK takes that
      port and never imports boto3. Env HUB_VAULT_KMS_KEY_ID maps to
      VAULT_KMS_KEY_ID default empty; VAULT_KEK_BACKEND=kms with empty key id
      refuses. T1 moto on the provider module. In-process DEK cache keyed by
      secret pk plus kek_id. Keyfile remains test/dev and does not defeat a
      stolen Hub disk. Live AWS KMS is a Joseph interrupt. vault/ and tests/
      do not import boto3 (D-059).
  - id: SEC-B3-AUDIT-HASH-CHAIN
    phase: 4
    verify: test
    source: phase-4-design-note.md §3
    text_hash: sha256:816a778bedf4a51cdd22ce92991ad0ed7280ca330f8e1b779dc1677587621ef7
    text: >
      audit() writes AuditEvent.prev_hash as sha256 of (prev_hash plus the
      canonical JSON row of ts, actor_id, source, action, object_type,
      object_id, detail, source_ip, severity with sorted keys and no
      whitespace) and never blocks on S3. Genesis prev_hash is empty. detail
      may hold refs and fingerprints, never DEKs, tokens, recovery codes, or
      PEM. S3 down files P2 audit-ship-failed.
  - id: P4-SECURITY-DEMO
    phase: 4
    verify: demo
    source: phase-4-design-note.md §4
    demo:
      - conformance/demos/phase-4.md
    text_hash: sha256:f1992fe8f7ce5a85d2225936b204b6335cffbcea2535e42f53b60b4dcd79531f
    text: >
      The phase-4 exit demo is recorded under conformance/demos/phase-4.md -
      WebAuthn plus phone passkey, T1 hardware touch, D-012 re-land, L5
      playbook on FakeEdgeProtection, never-scale refuse, topology r1-r5
      Findings, dual-key SSH rotate, backup persist and command-block restore,
      leftover honesty, Tailscale skip-unless or FakeTailscale, KmsKEK under
      moto (D-054).

