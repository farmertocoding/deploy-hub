    text: deploys/ reads only the stored manifest and never imports scanner modules; the wizard materializes module outputs into the manifest.

  # — Vault & crypto (Phases 1-4)
  - id: SEC-69-ENVELOPE-ENCRYPTION
    phase: 1
    verify: test
    source: deploy-system-plan.md §6.9
    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: Every vault secret is encrypted with its own fresh AES-256-GCM DEK wrapped by the KEK, with AAD binding record id and type; ciphertexts cannot be swapped between rows.
