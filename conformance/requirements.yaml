    text: Cloud/DNS SDK imports exist only under providers/ (superset of P0-IMPORT-RULE; scanned roots include tests, scripts_dev, conformance).
  - id: WIZ-V5-ONE-MANIFEST
    phase: 1
    verify: test
    source: plan-addendum-2026-08-02-review3.md §V5
    text_hash: sha256:f8c841d6606401404529413fcbb5fbfd92651545422bcb8db3692ef314ab694f
    text: One Site materializes exactly ONE manifest (service + optional static route + optional jobs); manifest rows are append-only and versioned, and carry env NAMES only, never values.
  - id: WIZ-ANSWER-VALIDATION
    phase: 1
    verify: test
    source: deploy-system-plan.md §4.5 / §5.2
    text_hash: sha256:42d36ed8802e3e31f30062baa333775c2eab850fc9f8edd2183eac85a41a234b
    text: Every wizard answer is validated against the question that produced it (kind, choices, emptiness); unknown question ids are rejected rather than ignored, and a partial save is all-or-nothing.
  - id: WIZ-MATERIALIZE-REFUSAL-NAMES-CAUSE
    phase: 1
    verify: test
    source: plan-addendum-2026-07-30.md §F4
    text_hash: sha256:aa5d6f310ecf99467d4aec1550950a9ac3f9a1a07d03d50b4c32723508cf3ffa
    text: Materialization refuses with 409 and a machine-readable cause naming the offending blockers, missing answers or values needing re-entry; it never returns a partial manifest and never 500s on ordinary state.
  - id: SCAN-D008-DEV-FALLBACK-TIER
    phase: 1
    verify: test
    source: DECISIONS.md D-008
    text: A committed secret literal whose name is reassigned in prod-reachable settings from a hard-fail environment read tiers as warning-with-context (django.secret-dev-fallback); unguarded literals and .get(default) fallbacks remain blockers, and a mixed project reports both.
  - id: ARCH-V6-DEPLOYS-NO-SCANNER-IMPORT
    phase: 1
    verify: test
    source: plan-addendum-2026-08-02-review3.md §V6
    text_hash: sha256:6f67ab9f1920fc6d7d6f78e538149c02d0e6065fa35bdf9b49c404e72b8bf5f8
    text: deploys/ reads only the stored manifest and never imports scanner modules; the wizard materializes module outputs into the manifest.

  # — Vault & crypto (Phases 1-4)
  - id: SEC-69-ENVELOPE-ENCRYPTION
    phase: 1
    verify: test
    source: deploy-system-plan.md §6.9
    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: Every vault secret is encrypted with its own fresh AES-256-GCM DEK wrapped by the KEK, with AAD binding record id and type; ciphertexts cannot be swapped between rows.
  - id: SEC-69-KEK-NEVER-IN-BACKUPS
    phase: 2
    verify: test
    source: deploy-system-plan.md §6.9
    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: The KEK is never present in the database, DB dumps, or backups; backups are client-side encrypted with a dedicated key.
  - id: SEC-69-NO-SECRETS-IN-EXHAUST
    phase: 1
    verify: static-gate
    source: deploy-system-plan.md §6.9
    # No gate: key. Round-5 F1: `make log-scrub` greps *source files* for an assignment
    # literal; this requirement is about *exhaust* (logs, Celery task args, API responses
    # after write) and names a CI scrubber over captured **test output**. Claiming
    # log-scrub here reported the req `verified` on a gate that enforces materially less.
    # Waived in WAIVERS.md until the real gate exists; log-scrub itself stays as the
    # source-scan gate it is. See tests/test_gate_parity.py::
    # test_issue_f1_secrets_in_exhaust_is_waived_not_gated_by_log_scrub.
    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: Secrets never appear in logs, Celery task args, or frontend responses after write; a CI log-scrubber greps test output for plaintext markers.
  - id: SEC-B4-REDIS-CROWN-JEWEL
    phase: 0
    verify: checklist
    source: plan-addendum-2026-07-30.md §B4
    text_hash: sha256:01fb861756de053947a3a9cb52613b23a9fac702e6ffba3ddd7d7d903be578a7
    text: Redis runs on the compose-internal network only with requirepass; Celery serializers are pinned to JSON.
  - id: SEC-B5-CF-TOKEN-SCOPING
    phase: 3
    verify: test
    source: plan-addendum-2026-07-30.md §B5
    text_hash: sha256:6eec96861c5b7374b8e1524725c2a23974eeb6eba2ce45a7aa2d48f340c569a5
    text: Cloudflare access uses two scoped tokens (DNS ops; attack playbook), never the Global API Key; an audit check verifies scopes.
  - id: SEC-A1-SESSION-AUTH
    phase: 0
    verify: test
    source: plan-addendum-2026-07-30.md §A1
    text_hash: sha256:03a0e992bcb8b765ce21a3b576864ee6c652d1b435a184f3bc81094fddbd61e2
    text: Hub auth is session-cookie (HttpOnly/Secure/SameSite=Lax) + CSRF header, not JWT; WebSocket rides the same session.
  - id: SEC-610-MANDATORY-2FA
    phase: 0
    verify: test
    source: deploy-system-plan.md §6.10
    text_hash: sha256:f36084eb1130bca807f24d0a7265672feb382431c29a72e00fb09b41afbdbaf2
    text: No panel session can use the API (HTTP or WS) without an enrolled, confirmed second factor; enrollment is forced at first login.
  - id: SEC-A2-WEBAUTHN-PHASE4
    phase: 4
    verify: test
    source: plan-addendum-2026-07-30.md §A2/§E9
    text_hash: sha256:67c3801f51f22753ee6e3c8cc55bfbbce03fd14dcd2e9e344e286dd5eb3c23be
    text: WebAuthn (django-otp-webauthn) becomes the primary second factor with TOTP fallback; step-up hardware touch gates T1 actions via require_recent_touch.

