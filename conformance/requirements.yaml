    text_hash: sha256:42d36ed8802e3e31f30062baa333775c2eab850fc9f8edd2183eac85a41a234b
    text: Every wizard answer is validated against the question that produced it (kind, choices, emptiness); unknown question ids are rejected rather than ignored, and a partial save is all-or-nothing.
