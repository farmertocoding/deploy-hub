  # PART-K* bumped to 5.5 above (text:/text_hash: untouched). New ids are
  # tier-less (no `tier:` key). New ids sit `uncovered` until later tasks
  # land proofs. P5-AWS-DEMO names conformance/demos/phase-5.md; do not
