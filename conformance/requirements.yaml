  - id: SCAN-D008-DEV-FALLBACK-TIER
    phase: 1
    verify: test
    source: DECISIONS.md D-008
    text: A committed secret literal whose name is reassigned in prod-reachable settings from a hard-fail environment read tiers as warning-with-context (django.secret-dev-fallback); unguarded literals and .get(default) fallbacks remain blockers, and a mixed project reports both.
