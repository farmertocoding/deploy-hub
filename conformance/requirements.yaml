  - id: PART-INTAKE-PROCESS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      `intake/**` is a separate process, not `INSTALLED_APPS`; credential-free import wall (no vault/core/deploys/Celery/cloud SDKs); public listener is the six K3 routes only; outbox is mesh-only; Hub product code does not import `intake`.
  - id: PART-K3-ENDPOINTS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      six K3 endpoints live on the intake under `/partner/v1/…`; Hub urlpatterns contain neither `/api/partner` nor `/mcp`.
  - id: PART-HUB-POLL
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      Beat polls the outbox every 10 s on `probes`; `intake_client_for` is fail-closed; empty `INTAKE_URL` is SKIPPED/no-op and does not insert a CheckRun every 10 s; N=3 failures file `hub-outbox-poll-failing`; unreachable >5 min files `partner-intake-unreachable`.
  - id: PART-Q9-SHARED-VECTORS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      one shared signature-vector file drives valid/expired/replayed/mutated-body plus idempotency and quota cases against both the intake verifier and the Hub re-verifier; Hub refuse wins on quota-exceeded.
  - id: PART-ISOLATION
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      isolation is `Partner` + `PartnerSite` + dedicated destination Targets; no `Site.tier`; no `Site.partner_id`; no `Target.tier`; Hub host and non-partner co-host refuse; partner overflow refuses.
  - id: PART-TEMPLATES
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      v1 deploys one digest-pinned fixture template image only; partner Dockerfile, build step, git-as-source, and unconstrained image refuse.
  - id: PART-WEBHOOKS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      Standard Webhooks exact; Hub egress only through `validate_webhook_url`; re-resolve at every delivery (no git clone-TOCTOU exception); T1 fake sink; `whsec_` vaulted Hub-side, never on intake, never in AuditEvent.detail.
  - id: PART-CUSTOM-HOSTNAME
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      Fake CustomHostname TXT-before-serve as a capability on the object `dns_provider_for` returns; helpers do not construct a Cloudflare client; unverified hostname is never served; no new ACME or DNS-01.
  - id: PART-KILL-SWITCH
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      `partner.create`/`partner.suspend`/`partner.api_kill_switch` are T1; `partner.site_takedown` is T2; enable is T1 not a toggle; global flag default OFF; Fake Transport stop+detach+revoke; reaper plants orphaned partner sites.
  - id: PART-M2-GIT-WEBHOOK
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      git-webhook is a second outbox type on the same Hub poller, Fake-planted, not a public intake or Hub route; no webhook secret on intake; Hub re-validates via `validate_git_url`.
  - id: PART-U2-QUOTAS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      Hub enforces `max_sites=5`, `deploys_per_day=50`, `domains=5`, fleet cap 12; intake copies are edge-only; unbounded max_sites is out.
  - id: UX-P55-PARTNERS
    phase: 5.5
    verify: test
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      Settings Partners tab after AWS is Create partner not Connect; POST 201 returns `hubk_*` + `whsec_` once (Enroll once-panel) and GET never; Fake / empty `INTAKE_URL` / post-create never Connected; destination-order T2 honesty on the tab (K5 abuse/IP-reputation sentence once for own-server); kill-switch overlays (enable is T1 not a toggle; suspend names stop/detach/revoke; takedown T2 on site detail); F8 partner-intake-empty/error/degraded plus kill/rank overlays and PartnerSite seed (never `Site.tier=partner`); Sites All/Mine/Partner + partner badge (symbol + words); hide adopt and job-create on partner site detail; copy never says instance except `single-instance` and never 99.9% SLA; NAV stays six.
  - id: P55-PARTNER-DEMO
    phase: 5.5
    verify: demo
    source: phase-5.5-design-note.md §3
    demo:
      - conformance/demos/phase-5.5.md
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      demo record names the MUST path in design note §4; no named partner, no live intake, no HMAC enablement, no MCP.
  - id: PART-U1-NAMED-PARTNER
    phase: 5.5
    verify: demo
    source: phase-5.5-design-note.md §3
    demo:
      - conformance/demos/named-partner.md
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      a named committed partner exists as a Joseph-filled artifact; missing file is uncovered; T1 fixture slugs are not this proof.
  - id: PART-Q9-T2-CONTAINER
    phase: 5.5
    verify: test
    tier: t2
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      intake container + Hub poller: signed job becomes a Deployment; tamper audits; replay rejected at Hub even when forwarded.
  - id: PART-Q9-T3-LIVE-PATH
    phase: 5.5
    verify: test
    tier: t3
    source: phase-5.5-design-note.md §3
    text_hash: sha256:cd5a677fd2adc268ac6b04e6099d487da6d8291b79479857a51efcd7d2071718
    text: >
      nightly live partner-path (named partner + test-zone template deploy + live webhook + live kill switch) runs only behind the existing test-plane wall; absent config is skipped-only.

  # ── Phase 6 (docs/phase-6-design-note.md §3, Task 0 / D-086…D-095).
  # New MUST ids are tier-less (no `tier:` key). New ids sit `uncovered`
  # until later tasks land proofs. P6-SCALER-DEMO names
  # conformance/demos/phase-6.md; do not stub that file here (missing
  # is uncovered; a non-empty stub would verify). Do not bump PART-K /
  # U1. Do not hang full-text auto-mode / AMI / ScalePolicy / live
  # provision on any T1 test.
  - id: SCALE-SUSTAINED-PROPOSE
    phase: 6
    verify: test
    source: phase-6.5-design-note.md §3
    text_hash: sha256:55240144ba8faa5c3a3a6b4f6ece8f9db07cde439e0c78c73993826b68795ee2
    text: >
      five consecutive distinct UTC minutes of HostMetric samples in a 300s Hub-clock window over the same axis (mem_pct>85 or load1>cores) file Finding kind scale-cheap-remediation fingerprint scale-cheap-remediation:{site.pk} whose body includes Cache-Control, Cloudflare cache, gunicorn 2×CPU+1, and the sentence propose-mode does not launch; disk-only heat does not file; an ACCEPTED cheap finding plus still-sustained pressure files scale-out-proposal as before.
  - id: SCALE-SPIKE-NO-PROPOSE
    phase: 6
    verify: test
    source: phase-6-design-note.md §3
    text_hash: sha256:cd013d0e1833039a97128ab62f9fff13acd19d59db1678e51959102bd4f2d404
    text: >
      a single sample over threshold among five, a missing minute, mixed axes, or samples older than the window do not file scale-out-proposal.
  - id: SCALE-NEVER-ATTACK
    phase: 6
    verify: test
    source: phase-6.5-design-note.md §3
    text_hash: sha256:55240144ba8faa5c3a3a6b4f6ece8f9db07cde439e0c78c73993826b68795ee2
    text: >
      evaluate_site calls refuse_if_attack first; when the attack playbook is engaged no scale-cheap-remediation and no scale-out-proposal is filed and an OPEN or ACKED cheap or overflow Finding for that site is system-resolved.
  - id: SCALE-NEVER-PARTNER
    phase: 6
    verify: test
    source: phase-6.5-design-note.md §3
    text_hash: sha256:55240144ba8faa5c3a3a6b4f6ece8f9db07cde439e0c78c73993826b68795ee2
    text: >
      a PartnerSite never receives scale-cheap-remediation or scale-out-proposal even on sustained pressure and a quiet attack playbook; binding PartnerSite after file system-resolves an OPEN cheap or overflow Finding.
  - id: SCALE-PROPOSE-NO-PROVISION
    phase: 6
    verify: test
    source: phase-6-design-note.md §3
    text_hash: sha256:cd013d0e1833039a97128ab62f9fff13acd19d59db1678e51959102bd4f2d404
    text: >
      propose-mode evaluate_site never creates a Target, never calls enroll_aws_target or InstanceCreateView, and scaling/ plus monitor/tasks.py plus monitor/host_metrics.py do not import provision.aws_enroll or providers.ec2.
  - id: SCALE-READY-PREREQ
    phase: 6
    verify: test
    source: phase-6-design-note.md §3
    text_hash: sha256:cd013d0e1833039a97128ab62f9fff13acd19d59db1678e51959102bd4f2d404
    text: >
      core.scale-ready is warning not blocker; Site.scale_ready defaults False; missing check or warning is False even if confirm_warnings; a failing or mesh_only site is ineligible; a passing public site can be proposed.
  - id: UX-P6-SINGLE-INSTANCE
    phase: 6
    verify: test
    source: phase-6-design-note.md §3
    text_hash: sha256:cd013d0e1833039a97128ab62f9fff13acd19d59db1678e51959102bd4f2d404
    text: >
      Sites payload emits scale_ready and does not alias single_instance to not scale_ready; SiteObserved paints single-instance-only iff scale_ready is false and is shown on list rows; F8 REQUIRED_STATE_IDS includes single-instance-only and scale-out-proposal; NAV stays six; copy never says instance except single-instance and single-instance-only; the proposal Finding has no Approve or Launch control.
  - id: P6-SCALER-DEMO
    phase: 6
    verify: demo
    source: phase-6-design-note.md §3
    demo:
      - conformance/demos/phase-6.md
    text_hash: sha256:cd013d0e1833039a97128ab62f9fff13acd19d59db1678e51959102bd4f2d404
    text: >
      demo record names the MUST path in design note §4; no live provision, no auto mode, no AMI, no ScalePolicy table.
  - id: SCALE-CHEAP-BEFORE-OVERFLOW
    phase: 6
    verify: test
    source: phase-6.5-design-note.md §3
    text_hash: sha256:55240144ba8faa5c3a3a6b4f6ece8f9db07cde439e0c78c73993826b68795ee2
    text: >
      evaluate_site files scale-cheap-remediation before scale-out-proposal; OPEN or ACKED cheap does not file overflow; ACCEPTED cheap unblocks scale-out-proposal; attack or partner refuse system-resolves OPEN or ACKED cheap.
  - id: SCALE-CHEAP-NO-MUTATE
    phase: 6
    verify: test
    source: phase-6.5-design-note.md §3
    text_hash: sha256:55240144ba8faa5c3a3a6b4f6ece8f9db07cde439e0c78c73993826b68795ee2
    text: >
      cheap-remediation evaluate_site never creates a Target, never calls EdgeProtection cache or enroll_aws_target, and does not rewrite gunicorn workers.
