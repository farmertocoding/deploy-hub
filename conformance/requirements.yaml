    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: The KEK is never present in the database, DB dumps, or backups; backups are client-side encrypted with a dedicated key.
  - id: SEC-69-NO-SECRETS-IN-EXHAUST
    phase: 1
    verify: test
    source: deploy-system-plan.md §6.9
    # Phase 4 Task 8 (D-061 / C9): exhaust gate is tests/test_secrets_in_exhaust.py
    # plus the pytest plugin in tests/conftest.py (scripts_dev/exhaust.py) over
    # captured stdout/stderr/log and Celery kwargs. `make log-scrub` stays the
    # source-scan for `SECRET_KEY\s*=`; it is not this requirement's gate (F1).
    text_hash: sha256:3b07eb437137dfaeb7a3457e8209653e3f7e6189548ce5c8f027be455caaede7
    text: Secrets never appear in logs, Celery task args, or frontend responses after write; a CI log-scrubber greps test output for plaintext markers.
  - id: SEC-B4-REDIS-CROWN-JEWEL
    phase: 0
