# CI workflow 2 — nightly. D-022: GitHub Actions billing is broken; this file
# is optional/dormant. D-023: the host of record is local Multipass +
# `make nightly`. A skipped GHA job is not the phase gate. Do not turn
# Actions billing back on. Do not require a green GitHub Check for phase exit.
#
# The Phase 2 full-suite stub is deleted: an always-on echo job would post a
# green Check if Actions billing were ever re-enabled. The only job is
# t3-qemu, vars-gated (default unset → skipped).
#
# As in push-checks.yml: gate scope and arguments live in the Makefile, never here
# (SPEC-gate-integrity.md §2).
name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "17 18 * * *"   # 02:17 Asia/Taipei
  workflow_dispatch:

jobs:
  # Optional T3 recipe. vars.HUB_ENABLE_GHA_QEMU defaults unset → this job is
  # skipped. Skipped GHA is not the phase gate (D-022 / D-023).
  t3-qemu:
    if: "${{ vars.HUB_ENABLE_GHA_QEMU == 'true' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Recipe when opted in (do not turn Actions billing back on):
      #   1. udev kvm (nested virt / /dev/kvm)
      #   2. QEMU + cloud-init equivalent of local Multipass
      #   3. make test-t3
      - name: t3 qemu
        run: make test-t3
