# CI workflow 2 — nightly. T3 live e2e (Multipass/QEMU VM, test DNS zone, LE
# staging) lands in Phase 2.5; this stub keeps the schedule slot warm and runs
# the full suite + conformance until then.
#
# As in push-checks.yml: gate scope and arguments live in the Makefile, never here
# (SPEC-gate-integrity.md §2). This file had its own copy of the conformance phase and
# went on running --phase 0 long after the Makefile moved to --phase 1.
name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "17 18 * * *"   # 02:17 Asia/Taipei
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: full test suite
        run: make test
      - name: conformance gate
        run: make conformance
