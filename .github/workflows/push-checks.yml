# CI workflow 1 — on-push gates. lint-and-unit is the <2 min T1 job; T2 is a
# separate job (D-019 pulled hub-test-target forward from the Phase 2.5 slot).
#
# No gate's scope or arguments appear in this file (SPEC-gate-integrity.md §2). A gate
# declared both here and in the Makefile drifts in whichever copy nobody runs, and that
# copy was always this one — see the R4-8/R4-12 table in the spec. Every gate step below
# is a `make <target>` call; only setup the Makefile does not own is spelled out here.
# Target definitions, tool flags and scan roots: see the Makefile.
name: push-checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: install shell linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
      # Static analysis + dependency audit. The audit is advisory until Phase 1 and the
      # Makefile keeps it that way; do not re-declare it here to change that.
      - name: lint gate
        run: make lint
      - name: log scrub
        run: make log-scrub
      - name: scripts lint
        run: make scripts-lint
      - name: secret scan
        run: make secret-scan
      - name: T1 unit tests
        run: make test
      # The mutation gate (spec-mutation-gate.md §4). Bare `make mutation`, same as the
      # Makefile's review-round chain runs and in the same position — R4-8 parity is the
      # whole reason this step carries no scope, no flags and no `if:`.
      - name: mutation gate
        run: make mutation
      - name: conformance gate
        run: make conformance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend deps
        run: |
          cd frontend && npm ci
          corepack enable
          cd ../sample-node-site && pnpm install --frozen-lockfile
      - name: generated client not stale (§4.5)
        run: make check-generated
      - name: frontend contract tests
        run: make test-frontend
      - name: frontend quality
        run: make frontend-quality
      - name: js advisory audit
        run: make js-audit
      - name: frontend build
        run: cd frontend && npx vite build

  t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: T2 hub-test-target
        run: make test-t2

  sensitive-path-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: label PRs touching sensitive paths (human-merge only)
        run: |
          echo "Sensitive-path enforcement: .github/CODEOWNERS + master branch protection (D-001). This job lists; it does not merge."
