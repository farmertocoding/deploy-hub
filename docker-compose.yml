# Phase 0 compose stack. Redis hardening per §B4: internal network only,
# requirepass, no published port. Queue split per §6.8: deploys / probes / control.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    networks: [internal]   # never a published port (§B4)

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 hub.asgi:application
    environment: &hub-env
      DJANGO_SETTINGS_MODULE: hub.settings.dev
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on: [db, redis]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; Tailscale fronts it in real use
    networks: [internal]

  worker-deploys:
    build: .
    command: celery -A hub worker -Q deploys -c 2 -n deploys@%h
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]

  worker-probes:
    build: .
    command: celery -A hub worker -Q probes -c 4 -n probes@%h
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]

  worker-control:
    build: .
    command: celery -A hub worker -Q control -c 1 -n control@%h
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]

  beat:
    build: .
    command: celery -A hub beat
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
