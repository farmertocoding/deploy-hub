# Phase 0 compose stack. Redis hardening per §B4: internal network only,
# requirepass, no published port. Queue split per §6.8: deploys / probes / control.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_PASSWORD_PROBES: ${POSTGRES_PASSWORD_PROBES:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]

  redis:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --user
      - hub_probes on >${REDIS_PASSWORD_PROBES:?set in .env} ~probes* ~_kombu.binding.probes* -@all +@read +@write +@connection +ping +info
    networks: [internal]   # never a published port (§B4)

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 hub.asgi:application
    environment: &hub-env
      DJANGO_SETTINGS_MODULE: hub.settings.compose
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?set in .env}
      HUB_TASK_ENVELOPE_SECRET: ${HUB_TASK_ENVELOPE_SECRET:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      HUB_VAULT_KEK_BACKEND: local
      HUB_VAULT_KEYFILE: /etc/deploy-hub/vault.key
    depends_on: [db, redis]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; Tailscale fronts it in real use
    networks: [internal]
    volumes:
      - hub-backups:/var/lib/deploy-hub/backups   # C7: test-now + command block
      - hub-vault:/etc/deploy-hub                 # rung-① KEK; never FakeKEK

  worker-deploys:
    build: .
    command: celery -A hub worker -Q deploys -c 2 -n deploys@%h
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]
    volumes:
      - hub-backups:/var/lib/deploy-hub/backups   # C7: backup-nightly persist
      - hub-vault:/etc/deploy-hub

  worker-probes:
    build: .
    command: celery -A hub worker -Q probes -c 4 -n probes@%h
    environment:
      <<: *hub-env
      POSTGRES_USER: hub_probes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROBES:?set in .env}
      REDIS_USER: hub_probes
      REDIS_PASSWORD: ${REDIS_PASSWORD_PROBES:?set in .env}
      HUB_VAULT_KEYFILE: ""
      HUB_TASK_ENVELOPE_SECRET: probes-cannot-sign
    depends_on: [db, redis]
    networks: [internal]
    volumes:
      - hub-backups:/var/lib/deploy-hub/backups   # C7: restore-drill unseal

  worker-control:
    build: .
    command: celery -A hub worker -Q control -c 1 -n control@%h
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]
    volumes:
      - hub-vault:/etc/deploy-hub

  beat:
    build: .
    command: celery -A hub beat
    environment: *hub-env
    depends_on: [db, redis]
    networks: [internal]


volumes:
  pgdata:
  hub-backups:
  hub-vault:

networks:
  internal:
    driver: bridge
