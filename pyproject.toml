# ADAPTATION: spec §3 asks for a 60s per-mutant timeout. mutmut 3 has no absolute
# setting; its limit is `(estimated test time + timeout_constant) * timeout_multiplier`.
# `1.0 * (est + 60)` is the honest spelling of "60 seconds more than this mutant's tests
# should need", which is what the spec's number is for — an infinite-loop mutant must be
# reported as a timeout rather than hang the gate.
timeout_constant = 60.0
timeout_multiplier = 1.0

# Expanding mutation to RBAC/tenancy pulls T2/T3 tests into the derived selection.
# The clean baseline must stay T1: Multipass is not part of the mutation sandbox.
pytest_add_cli_args = [
    "-q",
    "-m", "not t2 and not t3",
]

# mutmut 3 runs the tests inside a `mutants/` COPY of the tree (that is how the mutated
# module shadows the real one), so everything the selected tests import has to be in
# that copy. `tests/` and `pyproject.toml` are copied by default; these are the repo's
# import roots. NOT a scope declaration and not a second copy of one — it is the
# sandbox's contents, and `tests/test_mutation_gate.py` asserts it covers every package
# the Makefile's $(PY_ROOTS) derivation finds, so a package that lands next week cannot
# leave the sandbox half-built.
also_copy = [
    "catalog", "core", "deploys", "hub", "intake", "monitor", "providers", "provision",
    "realtime", "reconcile", "scaling", "scanner", "vault", "wizard",
    "conformance", "manage.py",
    # the acceptance tier scans this fixture repo from disk
    "sample-node-site",
    # tests/conftest.py execs scripts_dev/exhaust.py from disk; not a PY_ROOT
    # (no __init__.py). Omit this and a cold mutants/ rebuild fails stats
    # collection, leaving every mutant not-checked.
    "scripts_dev",
    # tests/acceptance/test_phase_4.py reads product screens and actions from
    # disk. Copy src+tests only — not the whole frontend tree (node_modules).
    "frontend/src",
    "frontend/tests",
    "WAIVERS.md",
    "docker-compose.yml",
    "Makefile",
    # Derived selection reads these from disk. Omit them and a cold mutants/
    # rebuild fails stats collection (FileNotFoundError on seed_v1.json /
    # sample-site / DECISIONS.md) and every mutant stays not-checked.
    "simulation",
    "sample-site",
    "DECISIONS.md",
    "images",
    # Directories, not nested files: mutmut copy2 does not mkdir parents
    # (mutants/.github/CODEOWNERS FileNotFoundError on a cold rebuild).
    ".github",
    "docs",
]
